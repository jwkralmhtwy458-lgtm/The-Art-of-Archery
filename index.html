<script>
    const ownerPhone = "966546346251"; 

    const ULTRA_INSTANCE_ID = "instance190124";
    const ULTRA_TOKEN = "e5q2838w8nwlmm4l"; 

    let products = [];
    let cart = [];
    let productQuantities = {};
    let currentUser = null;
    let isDevMode = false;
    let generatedOTP = null;
    let otpActionType = "";

    // جلب البيانات من التخزين المحلي للمتصفح
    function loadProductsFromCloud() {
      try {
        let localData = localStorage.getItem("store_products");
        products = localData ? JSON.parse(localData) : [];
        renderProducts();
      } catch (err) {
        console.error("خطأ في جلب البيانات المحلية:", err);
      }
    }

    // حفظ البيانات في التخزين المحلي فوراً وبدون أخطاء سحابية
    function saveProductsToCloud() {
      try {
        localStorage.setItem("store_products", JSON.stringify(products));
      } catch (err) {
        alert("تنبيه: تعذر حفظ البيانات محلياً. حجم الصور قد يكون كبيراً جداً.");
      }
    }

    function validateSaudiPhone(phone) {
      return /^05\d{8}$/.test(phone);
    }

    function checkPhoneInput(inputElement, errorMsgId) {
      inputElement.value = inputElement.value.replace(/[^0-9]/g, '');
      const errorDiv = document.getElementById(errorMsgId);
      if (inputElement.value.length > 0 && !validateSaudiPhone(inputElement.value)) {
        inputElement.classList.add('invalid-input');
        if (errorDiv) errorDiv.style.display = 'block';
      } else {
        inputElement.classList.remove('invalid-input');
        if (errorDiv) errorDiv.style.display = 'none';
      }
    }

    function openSupport() {
      let url = `https://wa.me/${ownerPhone}?text=${encodeURIComponent("السلام عليكم، أحتاج مساعدة بخصوص متجر فن الرماية.")}`;
      window.open(url, '_blank');
    }

    function changeQty(id, delta) {
      let inputEl = document.getElementById(`qty-${id}`);
      let currentVal = parseInt(inputEl.value) || 1;
      let newVal = currentVal + delta;
      if (newVal < 1) newVal = 1;
      inputEl.value = newVal;
      productQuantities[id] = newVal;
    }

    function updateQtyFromInput(id, val) {
      let parsed = parseInt(val);
      if (isNaN(parsed) || parsed < 1) parsed = 1;
      productQuantities[id] = parsed;
    }

    function renderProducts() {
      const container = document.getElementById("productsList");
      container.innerHTML = "";
      if (products.length === 0) {
        container.innerHTML = "لا توجد منتجات حالياً.";
        return;
      }
      products.forEach(item => {
        if (!productQuantities[item.id]) productQuantities[item.id] = 1;

        let devControls = isDevMode ? `
          <div class="dev-btns">
            <button class="btn-edit" onclick="openEditModal(${item.id})">تعديل ✏️</button>
            <button class="btn-delete" onclick="deleteProduct(${item.id})">حذف 🗑️</button>
          </div>
        ` : '';

        container.innerHTML += `
          <div class="product-card">
            <div>
              ${item.image ? `<img src="${item.image}">` : `<div class="no-img">لا توجد صورة</div>`}
              <h4 style="margin-top:8px;">${item.name}</h4>
              <p style="color: green; font-weight: bold; margin-top:4px;">${item.price} ر.س</p>
            </div>
            <div>
              <div class="qty-control">
                <button class="btn-qty" onclick="changeQty(${item.id}, 1)">+</button>
                <input type="number" class="qty-input" id="qty-${item.id}" value="${productQuantities[item.id]}" min="1" onchange="updateQtyFromInput(${item.id}, this.value)">
                <button class="btn-qty" onclick="changeQty(${item.id}, -1)">-</button>
              </div>
              <button class="btn-cart" onclick="addToCart(${item.id})">إضافة للسلة</button>
              ${devControls}
            </div>
          </div>`;
      });
    }

    function addToCart(id) {
      let item = products.find(p => p.id === id);
      let inputEl = document.getElementById(`qty-${id}`);
      let qtyToAdd = inputEl ? (parseInt(inputEl.value) || 1) : (productQuantities[id] || 1);

      if (item) {
        let existingCartItem = cart.find(c => c.id === id);
        if (existingCartItem) {
          existingCartItem.qty += qtyToAdd;
        } else {
          cart.push({ id: item.id, name: item.name, price: item.price, qty: qtyToAdd });
        }
        renderCart();
      }
    }

    function updateCartQty(id, delta) {
      let item = cart.find(c => c.id === id);
      if (item) {
        item.qty += delta;
        if (item.qty <= 0) {
          cart = cart.filter(c => c.id !== id);
        }
        renderCart();
      }
    }

    function setCartQtyDirect(id, val) {
      let parsed = parseInt(val);
      if (isNaN(parsed) || parsed <= 0) {
        cart = cart.filter(c => c.id !== id);
      } else {
        let item = cart.find(c => c.id === id);
        if (item) item.qty = parsed;
      }
      renderCart();
    }

    function renderCart() {
      const cartContainer = document.getElementById("cartItems");
      if (cart.length === 0) {
        cartContainer.innerHTML = "السلة فارغة";
        document.getElementById("cartTotal").innerText = "0";
        return;
      }
      let total = 0;
      cartContainer.innerHTML = "";
      cart.forEach(item => {
        let itemTotal = item.price * item.qty;
        total += itemTotal;
        cartContainer.innerHTML += `
          <div class="cart-item-row">
            <div>
              <div><strong>${item.name}</strong></div>
              <small style="color:#666;">${item.price} ر.س × ${item.qty}</small>
            </div>
            <div style="display:flex; align-items:center; gap:3px;">
              <button class="btn-qty" style="width:22px; height:22px; font-size:12px;" onclick="updateCartQty(${item.id}, 1)">+</button>
              <input type="number" class="qty-input" style="width:38px; height:24px; font-size:12px;" value="${item.qty}" min="1" onchange="setCartQtyDirect(${item.id}, this.value)">
              <button class="btn-qty" style="width:22px; height:22px; font-size:12px;" onclick="updateCartQty(${item.id}, -1)">-</button>
            </div>
          </div>`;
      });
      document.getElementById("cartTotal").innerText = total;
    }

    function openEditModal(id) {
      let item = products.find(p => p.id === id);
      if (!item) return;
      document.getElementById("editName").value = item.name;
      document.getElementById("editPrice").value = item.price;
      document.getElementById("editImageFile").value = "";
      
      document.getElementById("btnSaveEdit").onclick = () => saveProductEdit(id);
      document.getElementById("editModal").style.display = "flex";
    }

    function closeEditModal() { document.getElementById("editModal").style.display = "none"; }

    async function saveProductEdit(id) {
      let item = products.find(p => p.id === id);
      if (!item) return;

      const newName = document.getElementById("editName").value.trim();
      const newPrice = parseFloat(document.getElementById("editPrice").value);
      const editFile = document.getElementById("editImageFile");
      const btnSave = document.getElementById("btnSaveEdit");

      if (!newName || isNaN(newPrice)) return alert("يرجى كتابة الاسم والسعر بشكل صحيح.");

      item.name = newName;
      item.price = newPrice;

      if (editFile.files && editFile.files[0]) {
        try {
          btnSave.innerText = "جاري الضغط والحفظ...";
          btnSave.disabled = true;
          item.image = await compressAndResizeImage(editFile.files[0], 250, 0.4);
        } catch (e) {
          alert("خطأ في معالجة الصورة.");
          btnSave.innerText = "حفظ التعديلات";
          btnSave.disabled = false;
          return;
        }
      }

      renderProducts();
      saveProductsToCloud();
      
      btnSave.innerText = "حفظ التعديلات";
      btnSave.disabled = false;
      closeEditModal();
      alert("تمت العملية بنجاح!");
    }

    async function deleteProduct(id) {
      if (confirm("هل أنت تأكد من الحذف؟")) {
        products = products.filter(p => p.id !== id);
        cart = cart.filter(c => c.id !== id);
        renderProducts();
        renderCart();
        saveProductsToCloud();
      }
    }

    function compressAndResizeImage(file, maxWidth = 250, quality = 0.4) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (e) => {
          const img = new Image();
          img.src = e.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;

            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);

            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.onerror = error => reject(error);
        };
        reader.onerror = error => reject(error);
      });
    }

    async function addProduct() {
      const name = document.getElementById("pName").value.trim();
      const price = parseFloat(document.getElementById("pPrice").value);
      const fileInput = document.getElementById("pImageFile");
      const btnAdd = document.getElementById("btnAddProd");

      if (!name || isNaN(price)) return alert("أدخل بيانات المنتج بشكل صحيح");

      let imageBase64 = "";
      if (fileInput.files && fileInput.files[0]) {
        try {
          btnAdd.innerText = "جاري المعالجة...";
          btnAdd.disabled = true;
          imageBase64 = await compressAndResizeImage(fileInput.files[0], 250, 0.4);
        } catch (e) {
          alert("حدث خطأ أثناء معالجة الصورة.");
          btnAdd.innerText = "إضافة المنتج";
          btnAdd.disabled = false;
          return;
        }
      }

      products.push({ id: Date.now(), name: name, price: price, image: imageBase64 });
      
      renderProducts();
      saveProductsToCloud();

      document.getElementById("pName").value = "";
      document.getElementById("pPrice").value = "";
      fileInput.value = ""; 
      btnAdd.innerText = "إضافة المنتج";
      btnAdd.disabled = false;

      alert("تمت إضافة المنتج بنجاح!");
    }

    function openDevPanel() {
      let password = prompt("أدخل كلمة سر وضع المطور:");
      if (password === "MS1212") {
        isDevMode = true;
        document.getElementById("devPanel").style.display = "block";
        renderProducts();
      } else if (password !== null) alert("كلمة السر خاطئة!");
    }

    function closeDevPanel() { document.getElementById("devPanel").style.display = "none"; }
    function toggleAccountPanel() {
      const panel = document.getElementById("accountPanel");
      panel.style.display = panel.style.display === "none" || panel.style.display === "" ? "block" : "none";
    }

    function startLoginVerification() {
      const name = document.getElementById("userNameInput").value.trim();
      const phone = document.getElementById("userPhoneInput").value.trim();
      if (!name) return alert("يرجى كتابة الاسم الكامل");
      if (!validateSaudiPhone(phone)) return alert("يرجى كتابة رقم جوال سعودي صحيح");
      
      triggerOTPFlow(phone, "login");
    }

    function startCheckoutVerification() {
      if (cart.length === 0) return alert("السلة فارغة!");
      const name = document.getElementById("orderName").value.trim();
      const phone = document.getElementById("orderPhone").value.trim();
      const address = document.getElementById("orderAddress").value.trim();

      if (!name) return alert("يرجى كتابة الاسم الكامل");
      if (!validateSaudiPhone(phone)) return alert("يرجى كتابة رقم جوال صحيح");
      if (!address) return alert("يرجى كتابة العنوان");

      triggerOTPFlow(phone, "checkout");
    }

    async function triggerOTPFlow(userPhone, action) {
      generatedOTP = Math.floor(1000 + Math.random() * 9000).toString();
      otpActionType = action;

      document.getElementById("otpPhoneDisplay").innerText = userPhone;
      document.getElementById("otpInput").value = "";
      document.getElementById("otpModal").style.display = "flex";

      let formattedPhone = "966" + userPhone.substring(1);
      
      const directUrl = `https://api.ultramsg.com/${ULTRA_INSTANCE_ID}/messages/chat`;

      const params = new URLSearchParams();
      params.append('token', ULTRA_TOKEN);
      params.append('to', formattedPhone);
      params.append('body', `🎯 *متجر فن الرماية*\n\nرمز التحقق الخاص بك هو: *${generatedOTP}*`);

      try {
        let res = await fetch(directUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: params
        });
        let data = await res.json();
        if(data.sent === "true" || data.id) {
          console.log("تم الإرسال بنجاح عبر UltraMsg");
        } else {
          alert(`رمز التحقق للاختبار: ${generatedOTP}`);
        }
      } catch (err) {
        alert(`رمز التحقق للاختبار هو: ${generatedOTP}`);
      }
    }

    function closeOtpModal() { document.getElementById("otpModal").style.display = "none"; }

    function verifyOTP() {
      const userEnteredOTP = document.getElementById("otpInput").value.trim();
      if (userEnteredOTP === generatedOTP) {
        closeOtpModal();
        if (otpActionType === "login") completeLogin();
        else if (otpActionType === "checkout") completeCheckoutAndSendWhatsApp();
      } else {
        alert("رمز التحقق غير صحيح، يرجى إعادة المحاولة.");
      }
    }

    function completeLogin() {
      const name = document.getElementById("userNameInput").value.trim();
      const phone = document.getElementById("userPhoneInput").value.trim();
      currentUser = { name, phone };
      document.getElementById("displayUserName").innerText = currentUser.name;
      document.getElementById("displayUserPhone").innerText = currentUser.phone;
      document.getElementById("orderName").value = currentUser.name;
      document.getElementById("orderPhone").value = currentUser.phone;
      document.getElementById("loginForm").style.display = "none";
      document.getElementById("userInfo").style.display = "block";
      alert("تم تسجيل الدخول بنجاح!");
    }

    function logoutUser() {
      currentUser = null;
      document.getElementById("loginForm").style.display = "block";
      document.getElementById("userInfo").style.display = "none";
    }

    function completeCheckoutAndSendWhatsApp() {
      const name = document.getElementById("orderName").value.trim();
      const phone = document.getElementById("orderPhone").value.trim();
      const address = document.getElementById("orderAddress").value.trim();
      const map = document.getElementById("orderMap").value.trim() || "غير مدخل";

      let total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
      let itemsNames = cart.map(i => `- ${i.name} (العدد: ${i.qty}) بسعر: ${i.price * i.qty} ر.س`).join("\n");

      let message = `*طلب جديد من متجر فن الرماية* 🎯\n\n` +
                    `👤 *اسم العميل:* ${name}\n` +
                    `📱 *رقم الجوال:* ${phone}\n` +
                    `📍 *العنوان:* ${address}\n` +
                    `🗺️ *رابط الموقع:* ${map}\n\n` +
                    `🛒 *المنتجات المطلوبة:*\n${itemsNames}\n\n` +
                    `💰 *الإجمالي النهائي:* ${total} ر.س`;

      let whatsappUrl = `https://wa.me/${ownerPhone}?text=${encodeURIComponent(message)}`;
      
      alert("تم التحقق بنجاح! جاري إرسال الطلب إلى الواتساب الخاص بالمتجر.");
      window.open(whatsappUrl, '_blank');

      cart = [];
      renderCart();
    }

    loadProductsFromCloud();
  </script>
