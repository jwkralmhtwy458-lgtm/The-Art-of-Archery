<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>متجر فن الرماية</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0b1120;
      --bg-card: #151e32;
      --bg-input: #1e293b;
      --gold: #eab308;
      --gold-hover: #ca8a04;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --green: #10b981;
      --red: #ef4444;
      --border: #283548;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-main); line-height: 1.6; padding-bottom: 50px; }

    /* الهيدر */
    header {
      background: rgba(21, 30, 50, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      padding: 15px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
      flex-wrap: wrap;
      gap: 10px;
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand h1 { font-size: 22px; font-weight: 900; color: var(--gold); letter-spacing: 0.5px; }
    .cloud-status { font-size: 11px; padding: 3px 8px; border-radius: 20px; background: rgba(16, 185, 129, 0.15); color: var(--green); border: 1px solid rgba(16, 185, 129, 0.3); }

    .nav-btns { display: flex; gap: 8px; flex-wrap: wrap; }
    .btn {
      border: none; padding: 8px 14px; border-radius: 8px; font-weight: 700; cursor: pointer;
      transition: all 0.2s ease; font-size: 13px; display: inline-flex; align-items: center; gap: 6px;
    }
    .btn-account { background: var(--bg-input); color: var(--text-main); border: 1px solid var(--border); }
    .btn-account:hover { border-color: var(--gold); }
    .btn-dev { background: rgba(234, 179, 8, 0.15); color: var(--gold); border: 1px solid var(--gold); }
    .btn-dev:hover { background: var(--gold); color: #000; }
    .btn-support { background: #25D366; color: #fff; }
    .btn-support:hover { background: #1ebe5d; }

    /* البانر الترحيبي */
    .hero {
      text-align: center;
      padding: 35px 20px;
      background: radial-gradient(circle at center, #1e293b 0%, var(--bg-dark) 100%);
      border-bottom: 1px solid var(--border);
      margin-bottom: 25px;
    }
    .hero h2 { font-size: 26px; font-weight: 900; margin-bottom: 5px; }
    .hero p { color: var(--text-muted); font-size: 14px; }

    /* الحاوية الرئيسية */
    .container { max-width: 1250px; margin: 0 auto; padding: 0 15px; }

    /* اللوحات المنبثقة */
    .panel {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px;
      padding: 20px; margin-bottom: 25px; display: none; box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    }
    .panel-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 12px; margin-bottom: 15px; flex-wrap: wrap; gap: 10px; }
    .panel-header h3 { color: var(--gold); font-size: 18px; }

    /* تبويبات لوحة المطور */
    .dev-tabs { display: flex; gap: 10px; margin-bottom: 20px; }
    .tab-btn {
      background: var(--bg-input); color: var(--text-muted); border: 1px solid var(--border);
      padding: 10px 18px; border-radius: 8px; cursor: pointer; font-weight: 700; flex: 1; text-align: center;
    }
    .tab-btn.active { background: var(--gold); color: #000; border-color: var(--gold); }

    /* حقول الإدخال */
    input[type="text"], input[type="number"], input[type="file"], input[type="email"], input[type="password"] {
      width: 100%; padding: 11px 14px; background: var(--bg-input); border: 1px solid var(--border);
      border-radius: 8px; color: var(--text-main); font-size: 14px; margin-bottom: 10px; outline: none;
    }
    input:focus { border-color: var(--gold); }
    .invalid-input { border-color: var(--red) !important; }
    .error-msg { color: var(--red); font-size: 12px; display: none; margin-top: -6px; margin-bottom: 10px; }

    /* بطاقات الطلبات في لوحة المطور */
    .orders-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 15px; }
    .order-card {
      background: var(--bg-input); border: 1px solid var(--border); border-radius: 10px; padding: 15px;
      display: flex; flex-direction: column; justify-content: space-between; transition: 0.3s;
    }
    .order-card.delivered { border-color: var(--green); background: rgba(16, 185, 129, 0.05); }
    .order-top { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 8px; margin-bottom: 10px; }
    .order-num { background: var(--gold); color: #000; font-weight: 900; padding: 2px 10px; border-radius: 6px; font-size: 14px; }
    .badge-pending { background: rgba(234, 179, 8, 0.2); color: var(--gold); padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: 700; }
    .badge-delivered { background: rgba(16, 185, 129, 0.2); color: var(--green); padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: 700; }
    .order-detail { font-size: 13px; margin-bottom: 6px; color: #e2e8f0; }
    .order-items-box { background: var(--bg-dark); padding: 10px; border-radius: 6px; font-size: 12px; margin: 8px 0; color: #cbd5e1; white-space: pre-line; }
    .map-link-btn { display: inline-block; color: #38bdf8; text-decoration: underline; font-weight: 700; font-size: 13px; margin: 4px 0; }
    .btn-deliver {
      width: 100%; padding: 10px; border-radius: 8px; border: none; font-weight: 700; cursor: pointer;
      background: var(--green); color: #fff; margin-top: 10px; font-size: 14px;
    }
    .btn-deliver:hover { background: #059669; }
    .delivered-label {
      width: 100%; padding: 10px; border-radius: 8px; text-align: center; font-weight: 700;
      background: rgba(16, 185, 129, 0.15); color: var(--green); border: 1px solid var(--green); margin-top: 10px; font-size: 14px;
    }

    /* تخطيط المتجر */
    .store-layout { display: grid; grid-template-columns: 2fr 1fr; gap: 25px; align-items: start; }
    @media (max-width: 850px) { .store-layout { grid-template-columns: 1fr; } }

    .section-title { font-size: 19px; font-weight: 800; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }
    .section-title::before { content: ''; width: 4px; height: 20px; background: var(--gold); border-radius: 4px; }

    /* شبكة المنتجات */
    .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 15px; }
    .product-card {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden;
      display: flex; flex-direction: column; justify-content: space-between; transition: transform 0.2s, border-color 0.2s;
    }
    .product-card:hover { transform: translateY(-4px); border-color: var(--gold); }
    .product-img { width: 100%; height: 150px; object-fit: cover; background: #0f172a; }
    .no-img { width: 100%; height: 150px; background: #1e293b; display: flex; align-items: center; justify-content: center; color: var(--text-muted); font-size: 13px; }
    .product-body { padding: 12px; text-align: center; }
    .product-title { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
    .product-price { color: var(--gold); font-weight: 900; font-size: 16px; margin-bottom: 10px; }

    .qty-control { display: flex; justify-content: center; align-items: center; gap: 6px; margin-bottom: 10px; }
    .btn-qty {
      background: var(--bg-input); color: var(--text-main); border: 1px solid var(--border);
      width: 30px; height: 30px; border-radius: 6px; font-weight: bold; cursor: pointer;
    }
    .btn-qty:hover { border-color: var(--gold); color: var(--gold); }
    .qty-input { width: 45px !important; height: 30px; text-align: center; margin-bottom: 0 !important; padding: 0 !important; font-weight: 700; }

    .btn-add-cart {
      width: 100%; padding: 9px; background: var(--gold); color: #000; border: none;
      border-radius: 8px; font-weight: 800; cursor: pointer; font-size: 13px; transition: 0.2s;
    }
    .btn-add-cart:hover { background: var(--gold-hover); }

    .dev-card-actions { display: flex; gap: 6px; margin-top: 8px; }
    .btn-edit { flex: 1; background: #f59e0b; color: #000; border: none; padding: 6px; border-radius: 6px; font-weight: 700; cursor: pointer; font-size: 12px; }
    .btn-del { flex: 1; background: var(--red); color: #fff; border: none; padding: 6px; border-radius: 6px; font-weight: 700; cursor: pointer; font-size: 12px; }

    /* القسم الجانبي */
    .side-box { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 18px; margin-bottom: 20px; }
    .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); }
    .total-row { display: flex; justify-content: space-between; align-items: center; margin-top: 15px; font-size: 17px; font-weight: 900; color: var(--gold); }

    .bank-box {
      background: rgba(234, 179, 8, 0.08); border: 1px dashed var(--gold); border-radius: 8px;
      padding: 12px; margin: 12px 0; font-size: 13px;
    }
    .bank-box p { margin-bottom: 4px; }
    .iban-text { color: var(--gold); font-weight: 800; direction: ltr; display: inline-block; }

    .btn-whatsapp-order {
      width: 100%; padding: 13px; background: #25D366; color: #fff; border: none;
      border-radius: 8px; font-size: 15px; font-weight: 800; cursor: pointer; margin-top: 5px;
      box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3); transition: 0.2s;
    }
    .btn-whatsapp-order:hover { background: #1ebe5d; transform: translateY(-2px); }

    /* النوافذ المنبثقة */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85);
      display: none; justify-content: center; align-items: center; z-index: 1000; padding: 15px;
    }
    .modal-box { background: var(--bg-card); border: 1px solid var(--gold); padding: 24px; border-radius: 12px; max-width: 400px; width: 100%; }
  </style>
